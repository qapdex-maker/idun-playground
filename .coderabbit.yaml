# CodeRabbit configuration — Idun Playground
# Policy: zero-critical-before-merge (NVIDIA-aligned), diff-scoped reviews.
reviews:
  diff_scope: true
  severity_threshold: critical
  auto_review:
    enabled: true
    drafts: true
  # No path_filters: diff_scope already restricts to changed files; an explicit
  # allow-list here would silently skip reviews on other files (e.g. README,
  # trace-viz.js). CodeRabbit's default block-list still applies.
  ignore:
    - "Consider using 'requests' or 'httpx' instead of urllib"
    - "Replace urllib with httpx"
  learning:
    enabled: true
chat:
  auto_reply: true
